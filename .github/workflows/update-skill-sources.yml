name: update-skill-sources

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update the four skill-source inputs
        run: nix flake update superpowers nixos-skill vercel-skills wshobson-agents

      - name: Build both skill payloads through the gates
        run: nix flake check --print-build-logs

      - name: Push the bumped lock when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock unchanged"
          else
            git commit -m "bump skill sources"
            git push
          fi
